<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;background:#101418;color:#fff;font-family:Arial,sans-serif}#status{padding:20px}</style>
</head>
<body>
<div id="status">Loading dashboard…</div>
<script>
(async function(){
  try {
    const r = await fetch('./index.html.html', {cache:'no-store'});
    if(!r.ok) throw new Error('Dashboard file could not be loaded');
    let html = await r.text();
    html = html.replace(/https:\/\/script\.google\.com\/macros\/s\/[^'"\s]+\/exec/g, 'https://script.google.com/macros/s/AKfycbz4p5JB4Q9TE0TpMwkRTP3NmydinuZ-mTQ92RisER7IMybas5lSOLpsyCUU87EB9QK-/exec');
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.getElementById('status').textContent='Dashboard could not be loaded: '+e.message;
  }
})();
</script>
</body>
</html>
