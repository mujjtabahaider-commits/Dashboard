name: Finalize dashboard cloud storage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix cloud storage and clean up
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove obsolete duplicate Google Apps Script block.
          s = re.sub(r'<script>\s*// Google Sheets cloud storage connection.*?</script>\s*(?=</body>)', '', s, flags=re.S)
          # Main Apps Script POST uses no-cors, so the browser does not reject the write because Apps Script does not expose CORS response headers.
          s = s.replace("method:'POST',\n      headers:{'Content-Type':'text/plain;charset=utf-8'},", "method:'POST',\n      mode:'no-cors',\n      headers:{'Content-Type':'text/plain;charset=utf-8'},")
          # Replace duplicate helper functions with one consistent wrapper.
          s = re.sub(r'<script>\s*window\.googleSave\s*=\s*async function.*?</script>', '', s, flags=re.S)
          aliases = '''\n<script>\nwindow.googleSave = async function(key, data) {\n  try { await window.googleStorage.set(key, data); return true; }\n  catch (e) { console.error('Google cloud save failed:', e); return false; }\n};\nwindow.googleLoad = async function(key) {\n  try { const r = await window.googleStorage.get(key); return r ? r.value : null; }\n  catch (e) { console.error('Google cloud load failed:', e); return null; }\n};\n</script>\n'''
          s = s.replace('</body>', aliases + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/fix-storage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix cloud save CORS and remove temporary workflow'
          git push